name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. Publish lên npm ──────────────────────────────────────────
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 2. Build binary cho 3 platform ─────────────────────────────
  build-binaries:
    runs-on: ubuntu-latest
    needs: npm-publish
    strategy:
      matrix:
        include:
          - target: node20-linux-x64
            output: nemfile-linux
          - target: node20-macos-x64
            output: nemfile-macos
          - target: node20-win-x64
            output: nemfile-win.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Build binary
        run: npx @yao-pkg/pkg . --target ${{ matrix.target }} --output dist/${{ matrix.output }} --compress GZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  # ── 3. Tạo GitHub Release và đính kèm binaries ─────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## nemfile ${{ github.ref_name }}

            ### npx (cần Node)
            ```bash
            npx nemfile
            ```

            ### Standalone binary (không cần cài gì)
            Tải file phù hợp với OS → chạy thẳng:
            - **Linux**: `chmod +x nemfile-linux && ./nemfile-linux`
            - **macOS**: `chmod +x nemfile-macos && ./nemfile-macos`
            - **Windows**: chạy `nemfile-win.exe`
          files: |
            dist/nemfile-linux
            dist/nemfile-macos
            dist/nemfile-win.exe
